<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>S2 Minimal Test</title>
<script type="importmap">
{
  "imports": {
    "three": "../intre-3d-hero/lib/three.module.js",
    "three/addons/": "../intre-3d-hero/lib/addons/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(2, 1, 3);
camera.lookAt(0, 0, 0);

// 测试 1: 基础 Mesh
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.5, 0.5),
  new THREE.MeshBasicMaterial({ color: 0xff3355 })
);
scene.add(cube);

// 测试 2: InstancedBufferGeometry + ShaderMaterial
const VERT = `
attribute vec3 iOffset;
attribute vec3 iColor;
varying vec3 vColor;
void main() {
  vColor = iColor;
  vec3 pos = position + iOffset;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
}
`;
const FRAG = `
varying vec3 vColor;
void main() {
  gl_FragColor = vec4(vColor, 1.0);
}
`;

const baseQuad = new THREE.PlaneGeometry(0.2, 0.2);
const geo = new THREE.InstancedBufferGeometry();
geo.index = baseQuad.index.clone();
geo.setAttribute('position', baseQuad.getAttribute('position').clone());

const N = 100;
const offsets = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  offsets[i * 3] = (Math.random() - 0.5) * 2;
  offsets[i * 3 + 1] = (Math.random() - 0.5) * 2;
  offsets[i * 3 + 2] = (Math.random() - 0.5) * 2;
  colors[i * 3] = Math.random();
  colors[i * 3 + 1] = Math.random();
  colors[i * 3 + 2] = Math.random();
}
geo.setAttribute('iOffset', new THREE.InstancedBufferAttribute(offsets, 3));
geo.setAttribute('iColor', new THREE.InstancedBufferAttribute(colors, 3));
geo.instanceCount = N;

const mat = new THREE.ShaderMaterial({
  vertexShader: VERT,
  fragmentShader: FRAG,
  side: THREE.DoubleSide,
});
const instMesh = new THREE.Mesh(geo, mat);
instMesh.frustumCulled = false;
scene.add(instMesh);

// HUD
const hud = document.createElement('div');
hud.style.cssText = 'position:fixed;top:10px;left:10px;color:#fff;font:14px monospace;z-index:10';
document.body.appendChild(hud);

let frame = 0;
renderer.setAnimationLoop(() => {
  renderer.render(scene, camera);
  frame++;
  if (frame % 30 === 0) {
    const info = renderer.info.render;
    hud.textContent = `frame=${frame} calls=${info.calls} tris=${info.triangles}`;
    console.log('RENDER_INFO:', JSON.stringify(info));
  }
});
</script>
</body>
</html>
