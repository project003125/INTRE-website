<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S4 · Line2 Fat Fibers — RCT4 Lab</title>
<script type="importmap">
{
  "imports": {
    "three": "../intre-3d-hero/lib/three.module.js",
    "three/addons/": "../intre-3d-hero/lib/addons/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { buildFibers, TRACTS } from './shared/fibers.js';
import { decFromTangent } from './shared/dec.js';
import { buildShellGroup } from './shared/brain-shell.js';
import { createLab, attachTractToggles } from './shared/rig.js';

/* ================================================================
   S4 v3 核心思路：Line2 (fat lines) + NormalBlending + DEC 顶点色
   + 电流扫描波 bloom 动画

   关键改进（vs v1/v2）：
   1. NormalBlending 替代 AdditiveBlending → 干净、参考图级质感
   2. 更高 opacity (0.50) 补偿非加法混合
   3. 色彩提亮 1.4x → NormalBlending 下保持饱和度
   4. 低 bloom 基线 + 强扫描波峰值 → 电流流动感
   5. 高密度 (4.0) → 填满脑体积
   ================================================================ */

const S4_SAMPLES = 48;

/* ============ 构建场景 ============ */
const lab = createLab({
  tag: 'S4 v3',
  title: 'Line2 + NormalBlend + Current',
  desc: 'Line2 宽线 · NormalBlending 干净质感 · DEC 顶点色 · 低 bloom 基线 + 强电流扫描波峰值 · 360° 无死角。',
  bloom: { strength: 0.22, radius: 0.40, threshold: 0.72 },
  camera: { x: 2.0, y: 0.6, z: 2.8 },
});

lab.renderer.toneMappingExposure = 1.10;

const resolution = new THREE.Vector2(window.innerWidth, window.innerHeight);

let shell = null;
const tractMeshes = {};
let sharedLineMat = null;
let radialLineMat = null;  // 放射丝专用材质（更低 opacity）

function build(density, jitterScale) {
  // 清理旧 mesh
  for (const k of Object.keys(tractMeshes)) {
    const obj = tractMeshes[k];
    if (obj.geometry) obj.geometry.dispose();
    lab.brainGroup.remove(obj);
    delete tractMeshes[k];
  }
  if (sharedLineMat) { sharedLineMat.dispose(); sharedLineMat = null; }
  if (radialLineMat) { radialLineMat.dispose(); radialLineMat = null; }
  if (shell) { lab.brainGroup.remove(shell); shell = null; }

  // 幽灵壳 — 极淡，不遮挡纤维
  shell = buildShellGroup({ opacity: 0.12 });
  shell.renderOrder = 1;
  lab.brainGroup.add(shell);

  // 解剖束材质 — NormalBlending，中等 opacity
  sharedLineMat = new LineMaterial({
    vertexColors: true,
    linewidth: 2.0,          // 屏幕空间 2px
    worldUnits: false,
    transparent: true,
    opacity: 0.65,
    depthWrite: false,
    depthTest: true,
    blending: THREE.NormalBlending,
    dashed: false,
  });
  sharedLineMat.resolution = resolution;

  // 放射丝材质 — 更低 opacity + AdditiveBlending（丝绒填充感）
  radialLineMat = new LineMaterial({
    vertexColors: true,
    linewidth: 1.2,          // 更细
    worldUnits: false,
    transparent: true,
    opacity: 0.10,           // 极低，叠加出丝绒感
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending,
    dashed: false,
  });
  radialLineMat.resolution = resolution;

  // 纤维
  const { fibers, meta } = buildFibers(density, 20260725, jitterScale, S4_SAMPLES);

  // 按 tract 分组
  const byTract = {};
  for (let fi = 0; fi < fibers.length; fi++) {
    const f = fibers[fi];
    (byTract[f.tract.id] = byTract[f.tract.id] || []).push(f);
  }

  for (const tract of TRACTS) {
    const list = byTract[tract.id] || [];
    if (list.length === 0) continue;

    const isRadial = tract.kind === 'radial';
    const mat = isRadial ? radialLineMat : sharedLineMat;

    // 合并所有纤维到单一数组，纤维间用重复点断开
    const allPositions = [];
    const allColors = [];

    for (const f of list) {
      const pts = f.pts;
      const tan = f.tan;
      const n = S4_SAMPLES;

      for (let i = 0; i < n; i++) {
        allPositions.push(pts[i*3], pts[i*3+1], pts[i*3+2]);
        const [r, g, b] = decFromTangent(tan[i*3], tan[i*3+1], tan[i*3+2]);
        const u = i / (n - 1);
        // 端点衰减（中间亮、端点暗）→ 参考图的丝绒感
        const atten = 0.55 + 0.45 * Math.sin(u * Math.PI);
        // NormalBlending 色彩提亮（放射丝不提亮，靠叠加）
        const boost = isRadial ? 1.0 : 1.8;
        allColors.push(r * atten * boost, g * atten * boost, b * atten * boost);
      }
      // 重复最后一个点断开下一根纤维
      allPositions.push(pts[(n-1)*3], pts[(n-1)*3+1], pts[(n-1)*3+2]);
      allColors.push(0, 0, 0);
    }

    const geo = new LineGeometry();
    geo.setPositions(allPositions);
    geo.setColors(allColors);

    const line2 = new Line2(geo, mat);
    line2.computeLineDistances();
    line2.renderOrder = isRadial ? 2 : 3;  // 解剖束在上层
    line2.frustumCulled = false;
    line2.userData.name = tract.name;
    lab.brainGroup.add(line2);
    tractMeshes[tract.id] = line2;
  }

  return { fibers, meta };
}

let meta = build(3.0, 0.40).meta;
window.__renderer = lab.renderer;
window.__composer = lab.composer;
window.__camera = lab.camera;
window.__scene = lab.scene;

/* ============ GUI ============ */
lab.gui.section('BLOOM');
lab.gui.slider('强度 strength', 0, 2.5, 0.05, 0.22, v => lab.setBloom(v, null, null));
lab.gui.slider('半径 radius', 0, 1, 0.05, 0.40, v => lab.setBloom(null, v, null));
lab.gui.slider('阈值 threshold', 0, 1.5, 0.02, 0.72, v => lab.setBloom(null, null, v));

lab.gui.section('线宽 & 透明');
lab.gui.slider('解剖束线宽', 0.5, 5.0, 0.1, 2.0, v => { if (sharedLineMat) sharedLineMat.linewidth = v; });
lab.gui.slider('解剖束透明', 0.05, 0.90, 0.02, 0.65, v => { if (sharedLineMat) sharedLineMat.opacity = v; });
lab.gui.slider('放射丝线宽', 0.5, 3.0, 0.1, 1.2, v => { if (radialLineMat) radialLineMat.linewidth = v; });
lab.gui.slider('放射丝透明', 0.01, 0.30, 0.01, 0.10, v => { if (radialLineMat) radialLineMat.opacity = v; });

lab.gui.section('电流扫描');
lab.gui.slider('扫描速度', 0.01, 0.30, 0.01, 0.06, v => { sweepSpeed = v; });
lab.gui.slider('扫描峰值', 0.0, 0.80, 0.05, 0.30, v => { sweepPeak = v; });

lab.gui.section('场景');
lab.gui.slider('纤维密度', 1, 8, 0.5, 3.0, v => {
  meta = build(v, 0.40).meta;
  attachTractToggles(lab, tractMeshes, meta);
});
lab.gui.toggle('自动旋转', true, v => lab.controls.autoRotate = v);
lab.gui.toggle('幽灵壳脑', true, v => { if (shell) shell.visible = v; });
lab.gui.toggle('参考图对比', true, v => lab.refEl.style.opacity = v ? 1 : 0);

attachTractToggles(lab, tractMeshes, meta);

/* ============ 电流扫描波动画 ============ */
// 自下而上的 bloom 扫描波：低基线 + 周期性峰值
let sweepSpeed = 0.06;
let sweepPeak = 0.30;
const baseBloomStrength = 0.22;
const _origRender = lab.composer.render.bind(lab.composer);
lab.composer.render = function(...args) {
  const t = lab.uniforms.uTime.value;
  // 扫描波相位 0→1 循环
  const sweepPhase = (t * sweepSpeed) % 1.0;
  // 正弦包络：开始和结束平缓，中间峰值
  const sweepBoost = Math.sin(sweepPhase * Math.PI) * sweepPeak;
  lab.bloomPass.strength = baseBloomStrength + sweepBoost;
  return _origRender(...args);
};

/* ============ Resize ============ */
window.addEventListener('resize', () => {
  resolution.set(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
