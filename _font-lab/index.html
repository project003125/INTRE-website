<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTRE · 字体备选实验室（本地提案，未上线）</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #eef1f5; color: #0f172a; display: flex; flex-direction: column; overflow: hidden;
  }
  .lab-bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 18px; background: #fff; border-bottom: 1px solid #d8dee7;
  }
  .lab-logo { font-family: 'Josefin Sans', 'Century Gothic', sans-serif; font-weight: 600; font-size: 1.25rem; letter-spacing: -0.02em; color: #1F4880; }
  .lab-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; letter-spacing: 0.14em; color: #64748b; border: 1px solid #d8dee7; border-radius: 999px; padding: 3px 10px; }
  .lab-cands { display: flex; gap: 6px; flex-wrap: wrap; }
  .lab-cands button {
    font: 500 0.8rem/1 'Inter', 'Noto Sans SC', sans-serif; color: #334155;
    background: #f1f5f9; border: 1px solid #d8dee7; border-radius: 999px;
    padding: 8px 13px; cursor: pointer; transition: background .15s, color .15s, border-color .15s;
  }
  .lab-cands button b { font-family: 'JetBrains Mono', monospace; font-weight: 600; margin-right: 6px; color: #94a3b8; }
  .lab-cands button:hover { background: #e2e8f0; }
  .lab-cands button[aria-pressed="true"] { background: #1F4880; border-color: #1F4880; color: #fff; }
  .lab-cands button[aria-pressed="true"] b { color: #bdd0e8; }
  .lab-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  select {
    font: 500 0.8rem/1 'Inter', 'Noto Sans SC', sans-serif; color: #334155;
    border: 1px solid #d8dee7; border-radius: 8px; padding: 7px 8px; background: #fff;
  }
  .lab-view { display: flex; border: 1px solid #d8dee7; border-radius: 999px; overflow: hidden; }
  .lab-view button { font: 500 0.75rem/1 'Inter', 'Noto Sans SC', sans-serif; padding: 8px 12px; border: 0; background: #fff; color: #334155; cursor: pointer; }
  .lab-view button[aria-pressed="true"] { background: #0f172a; color: #fff; }
  .lab-desc { padding: 8px 18px; background: #f8fafc; border-bottom: 1px solid #d8dee7; font-size: 0.78rem; color: #475569; display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
  .lab-desc strong { color: #0f172a; font-size: 0.85rem; }
  .lab-desc .lock { font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; letter-spacing: 0.06em; color: #94a3b8; }
  .lab-stage { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
  .lab-stage.split { grid-template-columns: 1fr 1fr; }
  .pane { position: relative; min-width: 0; min-height: 0; border-right: 1px solid #d8dee7; }
  .pane:last-child { border-right: 0; }
  .pane[hidden] { display: none; }
  .pane iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .pane-tag {
    position: absolute; bottom: 12px; left: 12px; z-index: 5; pointer-events: none;
    font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; letter-spacing: 0.1em;
    background: rgba(15, 23, 42, 0.82); color: #fff; border-radius: 999px; padding: 4px 10px;
  }
  @media (max-width: 900px) {
    .lab-stage.split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .lab-right { margin-left: 0; }
  }
</style>
</head>
<body>
<header class="lab-bar">
  <span class="lab-logo">INTRE</span>
  <span class="lab-tag">FONT LAB · 字体备选</span>
  <div class="lab-cands" role="group" aria-label="字体备选方案"></div>
  <div class="lab-right">
    <select id="pageSel" aria-label="预览页面">
      <option value="../index.html">首页</option>
      <option value="../pse/">PSCE 内页</option>
      <option value="../textbook/">教材</option>
      <option value="../glossary/">术语表</option>
      <option value="../compare/">对比</option>
    </select>
    <div class="lab-view" role="group" aria-label="视图">
      <button type="button" data-v="single" aria-pressed="true">单页</button>
      <button type="button" data-v="split" aria-pressed="false">对照基线</button>
    </div>
  </div>
</header>
<p class="lab-desc">
  <strong id="descName"></strong>
  <span id="descText"></span>
  <span class="lock">LOCKED · INTRE 标志 = Josefin Sans · 代码 = JetBrains Mono（所有备选均不变）</span>
</p>
<main class="lab-stage" id="stage">
  <div class="pane" id="paneL" hidden>
    <span class="pane-tag">A · 现状基线</span>
    <iframe id="frL" title="现状基线预览"></iframe>
  </div>
  <div class="pane" id="paneR">
    <span class="pane-tag" id="tagR"></span>
    <iframe id="frR" title="备选方案预览"></iframe>
  </div>
</main>

<script>
(function () {
  'use strict';
  var G = 'https://fonts.googleapis.com/css2?family=';
  var MISANS = ['Regular', 'Medium', 'Semibold', 'Bold'].map(function (w) {
    return 'https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSans-' + w + '.min.css';
  });
  var HMOS = ['Regular', 'Medium', 'Semibold', 'Bold'].map(function (w) {
    return 'https://cdn.jsdelivr.net/npm/harmonyos-sans-sc-webfont-splitted@1.1.0/dist/' + w + '.css';
  });
  var LXGW = ['regular', 'bold', 'light'].map(function (w) {
    return 'https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-' + w + '.css';
  });
  var LOGO_LOCK = '.nav-logo,.footer-brand,.hero h1,.fusion-panel .fusion-psi{font-family:var(--font-logo) !important;font-weight:600 !important;}';
  var HEADS = 'h1,h2,h3,h4,.section-label';
  var BODY_FALL = "-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif";

  var CANDS = {
    A: {
      name: '现状基线',
      desc: 'Inter（西文）＋ Noto Sans SC（中文）＋ JetBrains Mono。作为对照，不做任何改动。',
      links: [], vars: {}, extra: ''
    },
    B: {
      name: 'MiSans · 现代屏显',
      desc: 'Manrope（西文）＋ MiSans（中文）。MiSans 字面更挺、中宫收紧、小字号灰度均匀；Manrope 的几何气质与 Josefin Sans 标志同族。',
      links: [G + 'Manrope:wght@400;500;600;700;800&display=swap'].concat(MISANS),
      vars: {
        '--font-body': "'Manrope','MiSans'," + BODY_FALL,
        '--font-chinese': "'MiSans','PingFang SC','Microsoft YaHei',sans-serif"
      },
      extra: ''
    },
    C: {
      name: 'HarmonyOS · 端正工程',
      desc: 'Inter（西文不变）＋ HarmonyOS Sans SC（中文）。笔画更直、重心更稳，长文与表格的工程文档感更强。',
      links: HMOS,
      vars: {
        '--font-body': "'Inter','HarmonyOS Sans SC'," + BODY_FALL,
        '--font-chinese': "'HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
      },
      extra: ''
    },
    D: {
      name: '衬线编辑 · 标题',
      desc: '标题与宣言改 Noto Serif SC ＋ Source Serif 4（衬线），正文保持 Inter ＋ Noto Sans SC。学术书卷气，靠标题/正文对比制造层级。',
      links: [G + 'Noto+Serif+SC:wght@400;600;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap'],
      vars: {},
      extra: HEADS + ',.manifesto-quote p{font-family:"Source Serif 4","Noto Serif SC","Songti SC",serif !important;}' + LOGO_LOCK
    },
    E: {
      name: '霞鹜文楷 · 书卷',
      desc: '全站正文与标题改 LXGW WenKai（开源楷体系）。手写温度最强，适合教材与宣言；数据密集页可读性需权衡。',
      links: LXGW,
      vars: {
        '--font-body': "'LXGW WenKai','Inter'," + BODY_FALL,
        '--font-chinese': "'LXGW WenKai','PingFang SC','Microsoft YaHei',sans-serif"
      },
      extra: ''
    },
    F: {
      name: '得意黑 · 海报标题',
      desc: '标题改 Smiley Sans（得意黑，斜切黑体）＋ 正文 MiSans ＋ Manrope。海报张力最强，正文仍保持屏显黑体。',
      links: [G + 'Manrope:wght@400;500;600;700;800&display=swap'].concat(MISANS),
      vars: {
        '--font-body': "'Manrope','MiSans'," + BODY_FALL,
        '--font-chinese': "'MiSans','PingFang SC','Microsoft YaHei',sans-serif"
      },
      extra: '@font-face{font-family:"Smiley Sans";font-style:normal;font-weight:400;font-display:swap;src:url("https://cdn.jsdelivr.net/npm/@fontpkg/smiley-sans@2.0.4/SmileySans-Oblique.ttf.woff2") format("woff2");}' +
        HEADS + ',.hero-zh,.hero-tagline{font-family:"Smiley Sans","MiSans",sans-serif !important;font-weight:400 !important;letter-spacing:0.01em;}' + LOGO_LOCK
    }
  };

  var stage = document.getElementById('stage');
  var paneL = document.getElementById('paneL');
  var frL = document.getElementById('frL');
  var frR = document.getElementById('frR');
  var tagR = document.getElementById('tagR');
  var descName = document.getElementById('descName');
  var descText = document.getElementById('descText');
  var pageSel = document.getElementById('pageSel');
  var candsBox = document.querySelector('.lab-cands');
  var viewBtns = document.querySelectorAll('.lab-view button');

  var params = new URLSearchParams(location.search);
  var cur = params.get('c') || localStorage.getItem('intre-fontlab-c') || 'B';
  if (!CANDS[cur]) cur = 'B';
  var page = params.get('p') || '../index.html';
  var view = params.get('v') || 'single';

  Object.keys(CANDS).forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.c = k;
    b.innerHTML = '<b>' + k + '</b>' + CANDS[k].name;
    b.addEventListener('click', function () { setCandidate(k); });
    candsBox.appendChild(b);
  });

  function inject(fr, k) {
    var doc = fr.contentDocument;
    if (!doc || !doc.head) return;
    doc.querySelectorAll('link[data-fontlab],style[data-fontlab]').forEach(function (n) { n.remove(); });
    var c = CANDS[k];
    c.links.forEach(function (href) {
      var l = doc.createElement('link');
      l.rel = 'stylesheet'; l.href = href; l.setAttribute('data-fontlab', k);
      doc.head.appendChild(l);
    });
    var css = ':root{' + Object.keys(c.vars).map(function (v) { return v + ':' + c.vars[v] + ';'; }).join('') + '}' + c.extra;
    var s = doc.createElement('style');
    s.setAttribute('data-fontlab', k);
    s.textContent = css;
    doc.head.appendChild(s);
  }

  function setCandidate(k) {
    cur = k;
    localStorage.setItem('intre-fontlab-c', k);
    candsBox.querySelectorAll('button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.c === k));
    });
    descName.textContent = k + ' · ' + CANDS[k].name;
    descText.textContent = CANDS[k].desc;
    tagR.textContent = k + ' · ' + CANDS[k].name;
    inject(frR, k);
  }

  function setView(v) {
    view = v;
    stage.classList.toggle('split', v === 'split');
    paneL.hidden = v !== 'split';
    viewBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
    if (v === 'split' && !frL.src) frL.src = page;
  }

  function setPage(p) {
    page = p;
    pageSel.value = p;
    frR.src = p;
    if (view === 'split') frL.src = p;
  }

  frR.addEventListener('load', function () { inject(frR, cur); });
  frL.addEventListener('load', function () { inject(frL, 'A'); });
  pageSel.addEventListener('change', function () { setPage(pageSel.value); });
  viewBtns.forEach(function (b) { b.addEventListener('click', function () { setView(b.dataset.v); }); });

  /* 对照模式：滚动比例同步 */
  var syncing = false;
  function sync(from, to) {
    from.addEventListener('load', function () {
      var w = from.contentWindow;
      w.addEventListener('scroll', function () {
        if (syncing || view !== 'split') return;
        var d = w.document.documentElement;
        var max = d.scrollHeight - w.innerHeight;
        var ratio = max > 0 ? w.scrollY / max : 0;
        var t = to.contentWindow;
        var td = t.document.documentElement;
        syncing = true;
        t.scrollTo(0, ratio * (td.scrollHeight - t.innerHeight));
        requestAnimationFrame(function () { syncing = false; });
      }, { passive: true });
    });
  }
  sync(frR, frL); sync(frL, frR);

  pageSel.value = page;
  setView(view);
  setCandidate(cur);
  frR.src = page;
  if (view === 'split') frL.src = page;
})();
</script>
</body>
</html>
