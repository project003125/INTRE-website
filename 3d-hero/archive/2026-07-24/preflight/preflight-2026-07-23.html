    <style id="theme-vars">
/* ============================================================
   INTRE 3D Hero 概念原型 — 项目品牌 CSS
   来源：06-格式治理/06-S-05-INTRE-品牌视觉规范.md v2.3.0
   brandPrefix: intre
   ============================================================ */

:root {
  /* ---------- INTRE Navy 品牌主色阶 ---------- */
  --intre-navy-950: #0A1E3D;
  --intre-navy-900: #102A4C;
  --intre-navy-800: #122F5C;
  --intre-navy-700: #1A3866;
  --intre-navy-600: #1F4880;
  --intre-navy-500: #2A5DA0;
  --intre-navy-400: #4A7BC0;
  --intre-navy-300: #7FA3D0;
  --intre-navy-200: #B8CFE8;
  --intre-navy-100: #D6E5F3;
  --intre-navy-50:  #F0F6FB;

  /* ---------- 语义别名（深色 Hero 场景） ---------- */
  --intre-background: var(--intre-navy-950);
  --intre-foreground: var(--intre-navy-100);
  --intre-card: var(--intre-navy-800);
  --intre-card-foreground: var(--intre-navy-100);
  --intre-primary: var(--intre-navy-500);
  --intre-primary-foreground: var(--intre-navy-50);
  --intre-muted: var(--intre-navy-700);
  --intre-muted-foreground: #93B4D8;
  --intre-border: #24466F;
  --intre-input: var(--intre-navy-800);
  --intre-ring: var(--intre-navy-400);

  /* ---------- 圆角（品牌硬约束：静态元素 ≤ 8px，按钮可用胶囊） ---------- */
  --intre-radius-sm: 4px;
  --intre-radius-md: 8px;
  --intre-radius-lg: 8px;
  --intre-radius-pill: 9999px;

  /* ---------- 强调色（品牌规范 3.2：Amber 占比小于5%，仅点睛） ---------- */
  --intre-amber-600: #D97706;
  --intre-amber-500: #F59E0B;
  --intre-amber-400: #FBBF24;

  /* ---------- 大地色系（数据编码色，非品牌强调色；
       品牌规范 3.3：同一视口不超过2种通道色） ---------- */
  --intre-uplp: #5A8270;   /* UPLP 语义通道 · 鼠尾草绿 */
  --intre-unip: #5B7080;   /* UNIP 神经通道 · 冷蓝灰 */
  --intre-ubmp: #9A7B5F;   /* UBMP 行为通道 · 赭石 */
  --intre-pse:  #6B7280;   /* PSE 计算引擎 · 中性灰 */
  --intre-rever:#7C6F64;   /* REVER 伦理审查 · 暖灰 */

  /* ---------- 字体（品牌规范第4节：不可替换） ---------- */
  --intre-font-display: 'Josefin Sans', 'Noto Sans SC', sans-serif;
  --intre-font-body: 'Inter', 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --intre-font-cjk: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --intre-font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;

  /* ---------- 阴影（品牌规范 3.4：仅 A 类环境光 / B 类硬投影） ---------- */
  --intre-shadow-a: 0 2px 8px rgba(10, 30, 61, 0.06), 0 8px 24px rgba(10, 30, 61, 0.05);
  --intre-shadow-b: 6px 6px 0 rgba(10, 30, 61, 0.08);
}

/* 品牌排版工具类 */
.intre-wordmark {
  font-family: var(--intre-font-display);
  font-weight: 600;
  letter-spacing: -0.02em;
}
.intre-h1 {
  font-family: var(--intre-font-display);
  font-weight: 600;
  letter-spacing: -0.03em;
}
.intre-mono {
  font-family: var(--intre-font-mono);
}
.intre-body {
  font-family: var(--intre-font-body);
}

    </style>

    --color-card-foreground: var(--intre-card-foreground);

    --color-muted: var(--intre-muted);
    --color-muted-foreground: var(--intre-muted-foreground);
    --color-border: var(--intre-border);
    --color-input: var(--intre-input);

    --radius-sm: var(--intre-radius-sm);
    --radius-md: var(--intre-radius-md);
    --radius-lg: var(--intre-radius-lg);

  @layer base {
    body { background: var(--intre-background); color: var(--intre-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
